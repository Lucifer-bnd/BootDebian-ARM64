name: Build BootDebian ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Debian 13 ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Build Debian RootFS
        run: |
          chmod +x scripts/*.sh
          chmod +x module/system/bin/bootdebian
          chmod +x module/customize.sh
          ./scripts/build-rootfs.sh

      - name: Package module
        run: |
          ./scripts/package-module.sh

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: BootDebian-ARM64
          path: bootdebian-arm64.zip
          if-no-files-found: error
          retention-days: 30

